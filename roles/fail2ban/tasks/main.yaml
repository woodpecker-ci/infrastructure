- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      - nftables
      - python3-systemd
    update_cache: true
    cache_valid_time: 3600

- name: Configure SSH jail
  ansible.builtin.copy:
    src: sshd.local
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0o644'
  notify: Restart fail2ban

- name: Install Woodpecker agent filter
  ansible.builtin.copy:
    src: woodpecker-agent.conf
    dest: /etc/fail2ban/filter.d/woodpecker-agent.conf
    owner: root
    group: root
    mode: '0o644'
  notify: Restart fail2ban

- name: Configure Woodpecker agent jail
  ansible.builtin.copy:
    src: woodpecker-agent.local
    dest: /etc/fail2ban/jail.d/woodpecker-agent.local
    owner: root
    group: root
    mode: '0o644'
  notify: Restart fail2ban

- name: Create fail2ban service configuration directory
  ansible.builtin.file:
    path: /etc/systemd/system/fail2ban.service.d
    state: directory
    owner: root
    group: root
    mode: '0o755'

- name: Order fail2ban after Docker
  ansible.builtin.copy:
    src: docker.conf
    dest: /etc/systemd/system/fail2ban.service.d/docker.conf
    owner: root
    group: root
    mode: '0o644'
  notify: Restart fail2ban

- name: Start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
  when: not ansible_check_mode
